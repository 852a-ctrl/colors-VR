<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Colors VR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* VR版：ゲームの画面はすべて3Dの中（空間に浮かぶ板）。HTMLはタイトルだけ */
:root{--paper:#fff;--ink:#000;--muted:#8a8a8a;--font:'DotGothic16','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font);user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#title{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;padding:24px}
#title h1{margin:0;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:400;font-size:clamp(56px,13vw,108px);letter-spacing:.16em;color:var(--paper);-webkit-text-stroke:2px var(--ink);padding-left:.16em}
#title .list{display:flex;flex-direction:column;gap:14px;min-width:240px}
.btn{font-family:var(--font);font-size:20px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);padding:14px 20px;cursor:pointer}
.btn:disabled{color:#b5b5b5;border-color:#b5b5b5}
.btn:focus-visible{outline:3px solid var(--muted);outline-offset:2px}
#title .note{font-size:13px;color:var(--muted);margin:0;text-align:center;line-height:1.7;max-width:36em}
#mode{font-size:15px;margin:0}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:6px 14px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:5}
#toast.show{opacity:1}
</style>
</head><body>
<canvas id="gl"></canvas>
<div id="night" hidden></div>
<div id="title">
  <h1>Colors</h1>
  <p id="mode">確認中…</p>
  <div class="list"><button class="btn" id="tNew" disabled>読み込み中…</button><button class="btn" id="tCont" disabled>つづきから</button></div>
  <p class="note">Meta Quest のブラウザで開くと、その場に立ったまま、周りを見回して遊びます。<br>パソコンでは、ドラッグか矢印キーで見回し、クリックかEで調べる・進める・選ぶ、J・K・Lで赤・緑・青、Qで光と色の切り替え、Escでメニュー、Rで正面を合わせる、Backspaceで手に取った物を戻す。</p>
  <p class="note" id="err"></p>
</div>
<div id="toast"></div>
<script>
window.__err = function (m) { var e = document.getElementById('err'); if (e) e.textContent += ' ' + m; };
window.addEventListener('error', function (ev) { window.__err('エラー：' + (ev.message || '不明')); });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
"use strict";
(function () {
const $ = id => document.getElementById(id);
if (typeof THREE === 'undefined') { window.__err('3D表示の部品を読み込めませんでした。'); return; }
const D2R = Math.PI / 180;
const SAVE_KEY = 'colors_vr_save_v1';
const FLOOR = -1.4, CEIL = 1.2, HGT = CEIL - FLOOR;   // パソコンでは目の高さを0とする。VRでは本物の床をFLOORに合わせる
const AIM = 0.24, LIGHT = 0.3;                       // 調べられる角度、光の届く角度（ラジアン）
const COLORS = ['red', 'green', 'blue'];
/* ================= 3D の土台 ================= */
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setClearColor(0xffffff, 1);
renderer.xr.enabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 100);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig);   // 体（頭と両手が入る）
// 手元に引き寄せたとき、プレイヤーの周り1.3mより奥（部屋）だけを暗くする幕
const dimS = new THREE.Mesh(new THREE.SphereGeometry(1.3, 24, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, side: THREE.BackSide, depthWrite: false }));
camera.add(dimS);
const lineMat = c => new THREE.LineBasicMaterial({ color: c });
const faceMat = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });
const INK = lineMat(0x000000);
const V = (x, y, z) => new THREE.Vector3(x, y, z);
function segs(pts, mat) {
  const g = new THREE.BufferGeometry().setFromPoints(pts.map(p => V(p[0], p[1], p[2])));
  return new THREE.LineSegments(g, mat || INK);
}
function loop(pts) { const o = []; for (let i = 0; i < pts.length; i++) o.push(pts[i], pts[(i + 1) % pts.length]); return o; }
const rect2 = (x0, y0, x1, y1, z) => loop([[x0, y0, z || 0], [x1, y0, z || 0], [x1, y1, z || 0], [x0, y1, z || 0]]);
function boxLines(w, h, d, mat) { const g = new THREE.BoxGeometry(w, h, d); return new THREE.LineSegments(new THREE.EdgesGeometry(g), mat || INK); }
function solidBox(w, h, d, color, edge) {
  const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), faceMat(color)); g.add(m); g.add(boxLines(w, h, d, edge)); return g;
}

// 壁：幅 w・高さ HGT の面から、穴をくりぬく。ローカル座標は x が左右、y が床からの高さ、面は +z を向く
function wall(w, holes, mat, edgeMat) {
  const g = new THREE.Group();
  const xs = [-w / 2, w / 2];
  for (const h of holes) xs.push(h.x - h.w / 2, h.x + h.w / 2);
  xs.sort((a, b) => a - b);
  const add = (x0, x1, y0, y1) => { if (x1 - x0 < 1e-4 || y1 - y0 < 1e-4) return; const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, y1 - y0), mat); m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0); g.add(m); };
  for (let i = 0; i < xs.length - 1; i++) {
    const x0 = xs[i], x1 = xs[i + 1], mid = (x0 + x1) / 2;
    const cov = holes.filter(h => Math.abs(mid - h.x) < h.w / 2).sort((a, b) => a.y - b.y);
    let y = 0;
    for (const h of cov) { add(x0, x1, y, h.y - h.h / 2); y = h.y + h.h / 2; }
    add(x0, x1, y, HGT);
  }
  const e = [];
  for (const h of holes) if (!h.noEdge) e.push(...rect2(h.x - h.w / 2, h.y - h.h / 2, h.x + h.w / 2, h.y + h.h / 2));
  if (e.length) { const l = segs(e, edgeMat || INK); l.position.z = 0.003; g.add(l); }
  return g;
}
// 部屋：幅 2W（左右）× 奥行き 2D（前後）
function roomShell(W, D, opt) {
  const grp = new THREE.Group();
  const wm = faceMat(opt.wall), em = lineMat(opt.edge);
  const place = (side, holes) => {
    const len = (side === 'front' || side === 'back') ? W * 2 : D * 2;
    const g = wall(len, holes || [], wm, em);
    placeOn(g, side, W, D); grp.add(g); return g;
  };
  const floorM = new THREE.Mesh(new THREE.PlaneGeometry(W * 2, D * 2), faceMat(opt.floor)); floorM.rotation.x = -Math.PI / 2; floorM.position.y = FLOOR; grp.add(floorM);
  const ceilM = new THREE.Mesh(new THREE.PlaneGeometry(W * 2, D * 2), faceMat(opt.wall)); ceilM.rotation.x = Math.PI / 2; ceilM.position.y = CEIL; grp.add(ceilM);
  const c = [[-W, -D], [W, -D], [W, D], [-W, D]], e = [];
  for (let i = 0; i < 4; i++) {
    const [x0, z0] = c[i], [x1, z1] = c[(i + 1) % 4];
    e.push([x0, FLOOR, z0], [x1, FLOOR, z1], [x0, CEIL, z0], [x1, CEIL, z1], [x0, FLOOR, z0], [x0, CEIL, z0]);
  }
  grp.add(segs(e, em));
  const gr = [], step = opt.grid || 0.5;
  for (let x = -W + step; x < W - 1e-6; x += step) gr.push([x, FLOOR + 0.002, -D], [x, FLOOR + 0.002, D]);
  for (let z = -D + step; z < D - 1e-6; z += step) gr.push([-W, FLOOR + 0.002, z], [W, FLOOR + 0.002, z]);
  grp.add(segs(gr, lineMat(opt.gridColor)));
  return { grp, place, W, D };
}
// 壁に物を貼る：side の壁の上で、ローカル x（左右）と y（床からの高さ）に置き、部屋の内側を向ける
function placeOn(obj, side, W, D, x, y, off) {
  x = x || 0; y = y || 0; off = off || 0;
  if (side === 'front') { obj.position.set(x, FLOOR + y, -D + off); obj.rotation.y = 0; }
  if (side === 'back') { obj.position.set(-x, FLOOR + y, D - off); obj.rotation.y = Math.PI; }
  if (side === 'right') { obj.position.set(W - off, FLOOR + y, x); obj.rotation.y = -Math.PI / 2; }
  if (side === 'left') { obj.position.set(-W + off, FLOOR + y, -x); obj.rotation.y = Math.PI / 2; }
  return obj;
}
function wallPos(side, W, D, x, y) { const o = new THREE.Object3D(); placeOn(o, side, W, D, x, y); return o.position.clone(); }

// 窓や隙間から見える町（白黒の線画）
let townTex = null;
function townTexture() {
  if (townTex) return townTex;
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 1024, 512);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let x = -20; x < 1040;) { const w = 50 + rnd() * 70, h = 120 + rnd() * 200; g.strokeStyle = '#9a9a9a'; g.lineWidth = 2; g.strokeRect(x, 470 - h, w, h); x += w + 6; }
  for (let x = -10; x < 1040;) {
    const w = 80 + rnd() * 110, h = 90 + rnd() * 170;
    g.fillStyle = '#fff'; g.fillRect(x, 500 - h, w, h); g.strokeStyle = '#000'; g.lineWidth = 3; g.strokeRect(x, 500 - h, w, h);
    g.lineWidth = 2; for (let yy = 500 - h + 16; yy < 470; yy += 30) for (let xx = x + 12; xx < x + w - 22; xx += 26) g.strokeRect(xx, yy, 12, 14);
    x += w + 14 + rnd() * 30;
  }
  g.lineWidth = 3; g.beginPath(); g.moveTo(170, 512); g.lineTo(170, 230); g.moveTo(820, 512); g.lineTo(820, 210); g.stroke();
  g.lineWidth = 1.5; g.beginPath(); g.moveTo(0, 260); g.quadraticCurveTo(170, 300, 170, 240); g.quadraticCurveTo(495, 300, 820, 220); g.quadraticCurveTo(930, 260, 1024, 250); g.stroke();
  townTex = new THREE.CanvasTexture(cv); townTex.anisotropy = 4; return townTex;
}
function townBehind(grp, x, y, z, w, h) { townLayers(grp, x, y, z, w, h); }
// 文字の板。白いふち取りで、どの背景でも読める
function textPlane(text, color, wid, opt) {
  opt = opt || {};
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 192;
  const g = cv.getContext('2d');
  g.font = `110px DotGothic16, 'Hiragino Kaku Gothic ProN', sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  let fs = opt.big ? 200 : 110; if (opt.big) g.font = `${fs}px DotGothic16, sans-serif`;
  while (g.measureText(text).width > 470 && fs > 40) { fs -= 6; g.font = `${fs}px DotGothic16, sans-serif`; }
  if (opt.outline !== false) { g.lineJoin = 'round'; g.strokeStyle = '#ffffff'; g.lineWidth = 16; g.strokeText(text, 256, 100); }
  g.fillStyle = color; g.fillText(text, 256, 100);
  if (opt.big) { g.strokeStyle = color; g.lineWidth = 7; g.strokeText(text, 256, 100); }   // 細い字を太く
  const t = new THREE.CanvasTexture(cv);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wid, wid * 192 / 512), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false, depthTest: !!opt.depth, side: THREE.DoubleSide }));
  m.renderOrder = opt.depth ? 1 : 10; return m;
}
// 赤い光で見える印：短い文字（「」を除いて4文字まで）はそのまま、長い文は「～」だけ。長い文は調べると読む
const isShort = t => [...t.replace(/[「」]/g, '')].length <= 4;
// 張り紙：白い紙に黒い字（2行）。そのまま読める
function makeNote(l1, l2) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 320;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 512, 320); g.strokeStyle = '#000'; g.lineWidth = 8; g.strokeRect(14, 14, 484, 292);
  g.fillStyle = '#000'; g.font = '88px DotGothic16, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  let fs = 88; while (g.measureText(l2).width > 460 && fs > 40) { fs -= 6; g.font = `${fs}px DotGothic16, sans-serif`; }
  g.fillText(l1, 256, 112); g.fillText(l2, 256, 214);
  return new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.375), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c) }));
}
function redMark(text, wid) { return isShort(text) ? textPlane(text, '#e01818', wid) : textPlane('～', '#e01818', wid * 1.6, { big: true }); }

// 扉（線画）。開くと奥が黒くなる
function makeDoor(color, fill) {
  const g = new THREE.Group(), w = 1.0, h = 2.0;
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.04, h - 0.04), faceMat(fill)); panel.position.set(0, h / 2, 0.004); g.add(panel);
  const dark = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.04, h - 0.04), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0, depthWrite: false }));
  dark.position.set(0, h / 2, 0.008); g.add(dark);
  const e = [...rect2(-w / 2, 0, w / 2, h), ...rect2(-w / 2 + 0.07, 0.05, w / 2 - 0.07, h - 0.07),
    [w / 2 - 0.2, 0.95, 0], [w / 2 - 0.13, 0.95, 0], [w / 2 - 0.13, 0.95, 0], [w / 2 - 0.13, 1.02, 0]];
  const l = segs(e, lineMat(color)); l.position.z = 0.01; g.add(l);
  return { g, dark, lines: l, panel };
}
// 箱（Colorsの木箱：縁と×印）。ふたは奥の辺を軸に開く。opt.paper：底の紙の数字、opt.back：裏面の赤い文字、opt.inside：緑の光で見える底の数字
function makeCrate(s, opt) {
  opt = opt || {};
  const g = new THREE.Group(), h = s / 2, m = faceMat(0xffffff);
  const face = (x, y, z, rx, ry) => { const p = new THREE.Mesh(new THREE.PlaneGeometry(s, s), m); p.position.set(x, y, z); p.rotation.set(rx || 0, ry || 0, 0); g.add(p); };
  face(0, -h, 0, -Math.PI / 2); face(0, 0, h); face(0, 0, -h); face(h, 0, 0, 0, Math.PI / 2); face(-h, 0, 0, 0, Math.PI / 2);
  const e = [], cube = [[-h, -h, -h], [h, -h, -h], [h, -h, h], [-h, -h, h]];
  for (let i = 0; i < 4; i++) { const a = cube[i], b = cube[(i + 1) % 4]; e.push(a, b, [a[0], h, a[2]], [b[0], h, b[2]], a, [a[0], h, a[2]]); }
  const k = h - 0.04, o = 0.002;
  e.push([-k, -k, h + o], [k, k, h + o], [k, -k, h + o], [-k, k, h + o]);
  if (!opt.back) e.push([-k, -k, -h - o], [k, k, -h - o], [k, -k, -h - o], [-k, k, -h - o]);
  e.push([h + o, -k, -k], [h + o, k, k], [h + o, -k, k], [h + o, k, -k]);
  e.push([-h - o, -k, -k], [-h - o, k, k], [-h - o, -k, k], [-h - o, k, -k]);
  g.add(segs(e));
  const out = { g, opening: null };
  if (opt.paper) {
    const pc = document.createElement('canvas'); pc.width = 256; pc.height = 256;
    const pg = pc.getContext('2d'); pg.fillStyle = '#fff'; pg.fillRect(0, 0, 256, 256); pg.strokeStyle = '#000'; pg.lineWidth = 4; pg.strokeRect(10, 10, 236, 236);
    pg.fillStyle = '#000'; pg.font = '150px DotGothic16, sans-serif'; pg.textAlign = 'center'; pg.textBaseline = 'middle'; pg.fillText(opt.paper, 128, 138);
    const paper = new THREE.Mesh(new THREE.PlaneGeometry(s * 0.7, s * 0.7), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(pc) }));
    paper.rotation.x = -Math.PI / 2; paper.rotation.z = 0.15; paper.position.set(0, -h + 0.006, 0); g.add(paper);
  }
  if (opt.back) {   // 裏面（-z）の外側に書かれた文字
    const t = textPlane(opt.back, '#e01818', s * 0.95, { depth: true, outline: false });
    t.rotation.y = Math.PI; t.position.set(0, 0, -h - 0.004); t.material.opacity = 0; g.add(t); out.back = t;
  }
  if (opt.inside) {   // 底に、緑の光でだけ見える数字
    const t = textPlane(opt.inside, '#111111', s * 0.9, { depth: true, outline: false });
    t.rotation.x = -Math.PI / 2; t.position.set(0, -h + 0.008, 0); t.material.opacity = 0; g.add(t); out.inside = t;
  }
  const lid = new THREE.Group(); lid.position.set(0, h, -h); g.add(lid);
  const lp = new THREE.Mesh(new THREE.PlaneGeometry(s, s), m); lp.rotation.x = -Math.PI / 2; lp.position.set(0, 0, h); lid.add(lp);
  lid.add(segs([...loop([[-h, o, 0], [h, o, 0], [h, o, s], [-h, o, s]]), [-k, o, h - k], [k, o, h + k], [k, o, h - k], [-k, o, h + k]]));
  out.lid = lid; out.size = s;
  return out;
}
// 過去の人：青い点線の人の形。青い光を出している間だけ見える
function makeGhost() {
  const g = new THREE.Group();
  const mat = new THREE.LineDashedMaterial({ color: 0x3a64ff, dashSize: 0.05, gapSize: 0.035, transparent: true, opacity: 0 });
  const head = []; for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2, b = (i + 1) / 20 * Math.PI * 2; head.push([Math.cos(a) * 0.13, 1.52 + Math.sin(a) * 0.13, 0], [Math.cos(b) * 0.13, 1.52 + Math.sin(b) * 0.13, 0]); }
  const body = segs([...head, [0, 1.39, 0], [0, 0.82, 0], [0, 0.82, 0], [-0.15, 0, 0], [0, 0.82, 0], [0.15, 0, 0], [0, 1.28, 0], [-0.26, 0.86, 0]], mat);
  body.computeLineDistances(); g.add(body);
  const arm = new THREE.Group(); arm.position.set(0, 1.28, 0); g.add(arm);
  const al = segs([[0, 0, 0], [0.27, -0.4, 0]], mat); al.computeLineDistances(); arm.add(al);
  const gh = { g, mat, arm, last: null }; GHOSTS.push(gh); return gh;
}
// 歩く道：点をつなぎ、stops の点では pause 秒止まる。最後に endPause 秒止まって最初に戻る
function makeRoute(pts, stops, pause, endPause, speed) {
  const seg = []; let t = 0;
  for (let i = 0; i < pts.length; i++) {
    if (i > 0) { const a = pts[i - 1], b = pts[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]); seg.push({ t0: t, t1: t + d / speed, a, b }); t += d / speed; }
    const p = stops.includes(i) ? pause : (i === pts.length - 1 ? endPause : 0);
    if (p > 0) { seg.push({ t0: t, t1: t + p, a: pts[i], b: pts[i], stop: i }); t += p; }
  }
  return { total: t, at(time) {
    const tt = time % t;
    for (const s of seg) if (tt <= s.t1) { const k = s.t1 > s.t0 ? (tt - s.t0) / (s.t1 - s.t0) : 1; return { x: s.a[0] + (s.b[0] - s.a[0]) * k, z: s.a[1] + (s.b[1] - s.a[1]) * k, stop: s.stop, k, last: s === seg[seg.length - 1] }; }
    const l = pts[pts.length - 1]; return { x: l[0], z: l[1] };
  } };
}

/* ================= 状態 ================= */
let room = null;     // いまの部屋 { id, grp, targets, tick }
const G = { flags: newFlags(), log: [] };
function newFlags() { return { red: false, green: false, blue: false, redPaint: false, paintGB: false, white: false, seen: {}, ev: {} }; }

/* ================= 通路の共通の作り（グレー、正面に端末とその左に隙間、左に入口、右に出口） ================= */
function corridor(color, opt) {
  const W = 3.0, D = 1.5, F = G.flags;
  const sh = roomShell(W, D, { wall: 0xc4c4c4, floor: 0xb0b0b0, edge: 0x3a3a3a, gridColor: 0x9a9a9a, grid: 1.0 });
  const crack = { x: -1.3, y: 1.55, w: 0.09, h: 1.3 };
  const holes = { front: [crack], back: [], left: [], right: [] };
  const build = extra => {
    for (const k in extra || {}) holes[k].push(...extra[k]);
    for (const s of ['front', 'back', 'left', 'right']) sh.place(s, holes[s]);
    townBehind(sh.grp, -1.3, 0.2, -D - 2.2, 6, 3);
    crackSlot(sh.grp, crack, D);
    const seam = [], ml = lineMat(0x8a8a8a);
    for (const x of [-2, -1, 0, 1, 2]) { if (Math.abs(x - crack.x) > 0.2 && !holes.front.some(h => Math.abs(h.x - x) < h.w / 2 + 0.05)) seam.push([x, FLOOR, -D + 0.003], [x, CEIL, -D + 0.003]); seam.push([x, FLOOR, D - 0.003], [x, CEIL, D - 0.003]); }
    for (const z of [-0.75, 0.75]) seam.push([-W + 0.003, FLOOR, z], [-W + 0.003, CEIL, z], [W - 0.003, FLOOR, z], [W - 0.003, CEIL, z]);
    sh.grp.add(segs(seam, ml));
  };
  // 端末（正面の壁の真ん中）
  const term = new THREE.Group();
  const tbm = new THREE.MeshBasicMaterial({ color: 0xe6e6e6, transparent: true, opacity: 1 });
  const tb = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.75, 0.14), tbm); term.add(tb);
  const tl = new THREE.LineSegments(new THREE.EdgesGeometry(tb.geometry), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true })); term.add(tl);
  const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.22), new THREE.MeshBasicMaterial({ color: color && F[color] ? ({ red: 0xe02020, green: 0x20b040, blue: 0x2a50ff })[color] : 0x2a2a2a, transparent: true }));
  scr.position.set(0, 0.16, 0.071); term.add(scr);
  const keys = segs([...loop([[-0.18, -0.06, 0.072], [0.18, -0.06, 0.072], [0.18, -0.3, 0.072], [-0.18, -0.3, 0.072]]),
    [-0.06, -0.06, 0.072], [-0.06, -0.3, 0.072], [0.06, -0.06, 0.072], [0.06, -0.3, 0.072], [-0.18, -0.18, 0.072], [0.18, -0.18, 0.072]], new THREE.LineBasicMaterial({ color: 0x000000, transparent: true }));
  term.add(keys);
  term.position.set(0, -0.25, -D + 0.07); if (!(opt && opt.noTerm)) sh.grp.add(term);
  // 入口（左の壁）
  const ent = makeDoor(0x3a3a3a, 0xb8b8b8); placeOn(ent.g, 'left', W, D, 0, 0, 0.004); sh.grp.add(ent.g);
  const targets = {
    crack: { pos: V(crack.x, FLOOR + crack.y, -D), act: () => true,
      examine() { say(['隙間から私のいた町が見える。', 'ただ、体が通らないし、奥には透明な壁があるようにみえる']); } }
  };
  // 端末を調べると、その色の光が使えるようになる
  const grant = (c) => {
    if (!F[c]) {
      F[c] = true; scr.material.color.set(({ red: 0xe02020, green: 0x20b040, blue: 0x2a50ff })[c]); softFlash(c);
      showButton('btn' + c[0].toUpperCase() + c.slice(1));
      say('何かが変わった気がする。', () => startHint(false), true);
    } else say('端末は静かに光っている。');
  };
  const termTarget = (c) => ({ pos: V(0, -0.25, -D), act: () => true, examine: () => grant(c) });
  return { sh, W, D, build, term, termMats: [tbm, tl.material, scr.material, keys.material], targets, termTarget, ent };
}
// 隔壁（厚い鉄の板）。開くと上に上がる
function makeBulk(w, h) {
  const g = new THREE.Group();
  const dark = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: 0x000000 })); dark.position.set(0, h / 2, 0.002); g.add(dark);
  const plate = new THREE.Group(); g.add(plate);
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), faceMat(0x8e8e8e)); p.position.set(0, h / 2, 0.006); plate.add(p);
  const e = [...rect2(-w / 2, 0, w / 2, h, 0.01)];
  for (let y = 0.25; y < h; y += 0.35) e.push([-w / 2, y, 0.01], [w / 2, y, 0.01]);
  for (let x = -w / 2 + 0.1; x < w / 2; x += 0.25) e.push([x, 0, 0.01], [x + 0.18, 0.18, 0.01]);
  plate.add(segs(e, lineMat(0x2a2a2a)));
  return { g, plate, h };
}
function shutter() {
  const sht = new THREE.Group(); const sp = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 2.1), faceMat(0xa8a8a8)); sp.position.set(0, 1.05, 0.004); sht.add(sp);
  const se = [...rect2(-0.6, 0, 0.6, 2.1, 0.01)]; for (let y = 0.12; y < 2.1; y += 0.12) se.push([-0.6, y, 0.01], [0.6, y, 0.01]);
  sht.add(segs(se, lineMat(0x333333))); return sht;
}

  // ---- 通路3：端末で青。青い光で過去の人が正面の壁の右で何かをする。そのあと緑の光で壁が透けて通り道 → シャッターの先へ ----
  c3: () => {

  // ---- ステージ1-4：鍵付きの宝箱。過去の人が止まった3か所のボタンを同じ順に → 鍵 → 宝箱 → 白紙の紙「～」→ 扉に青・緑・赤の順で「開く」 ----
  s4: () => {

    // 鍵（正面の壁ぞいの床）
    const key = new THREE.Group(); const ring = []; for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, b = (i + 1) / 16 * Math.PI * 2; ring.push([Math.cos(a) * 0.05 - 0.1, 0, Math.sin(a) * 0.05], [Math.cos(b) * 0.05 - 0.1, 0, Math.sin(b) * 0.05]); }
    key.add(segs([...ring, [-0.05, 0, 0], [0.12, 0, 0], [0.08, 0, 0], [0.08, 0, 0.04], [0.12, 0, 0], [0.12, 0, 0.05]]));
    const keyPos = V(-0.2, FLOOR + 0.01, -2.0); key.position.copy(keyPos); key.scale.setScalar(1.6); sh.grp.add(key);

        r1.push([Math.cos(a) * 0.22, 0, Math.sin(a) * 0.22], [Math.cos(c) * 0.22, 0, Math.sin(c) * 0.22]); r2.push([Math.cos(a) * 0.14, 0, Math.sin(a) * 0.14], [Math.cos(c) * 0.14, 0, Math.sin(c) * 0.14]); }

    // 扉

    const doorPos = V(W, FLOOR + 1.0, 0);

    let chestOpen = null, paperRise = null, keyPop = null, clock = 0, seq = 0, prevC = null;
    const chestLock = V(0, 0.1, 0.235).applyQuaternion(chest.quaternion).add(chestHome);

          bt.pulse = 1; click(bt.pos);
          const p = F.ev.bprog || 0;
          if (bt.i === p) F.ev.bprog = p + 1; else F.ev.bprog = (bt.i === 0) ? 1 : 0;
          if (F.ev.bprog >= 3) { F.ev.s4_key = true; F.ev.bprog = 0; key.visible = true; keyPop = 0; rumble(0.5, false, keyPos); say('鍵が現れた。'); }
        } };

      // 過去の人
      const blueOn = lightColor() === 'blue' && !insp;
      if (blueOn) clock += dt;
      const p = route.at(clock);
      gh.g.position.set(p.x, FLOOR, p.z); gh.g.lookAt(0, FLOOR, 0);
      gh.arm.rotation.z = Math.sin(clock * 4) * 0.25;
      gh.mat.opacity += ((blueOn ? 0.95 : 0) - gh.mat.opacity) * Math.min(1, dt * 8); gh.g.visible = gh.mat.opacity > 0.02;
      if (blueOn && inView(gh.g.position.clone().add(V(0, 1.0, 0)), 0.7)) F.seen.ghost_s4 = true;
      // ボタン：緑の光を当てている間だけ見える。一度見たら押せる

  // ---- 通路4：端末に触れると来た道が閉じ、？？？の話。15秒後に「私を見ろ」。青い光で過去の人 → カバーの奥のスイッチ → 赤い色。ロックを書き換えて隔壁 ----

          if (!F.ev.c4_cover) {
            if (!F.ev.c4_cover_off) { say('誰かがカバーを外していた。外してみよう。', null, true); return; }

              F.ev.c4_cover = true; F.ev.c4_lit = true; quake(1.2); rumble(1.4, true); C.termMats[2].color.set(0xffffff);

  // ---- ステージ3-1：何もない部屋。？？？の話 → 過去の人 → 黒で世界を塗る → 白い扉 ----
  s7: () => {
    const W = 2.5, D = 2.5, F = G.flags;
    const sh = roomShell(W, D, { wall: 0xffffff, floor: 0xffffff, edge: 0x000000, gridColor: 0xd4d4d4 });
    sh.place('front'); sh.place('back'); sh.place('left'); sh.place('right');
    const back = makeBulk(1.1, 2.1); placeOn(back.g, 'left', W, D, 0, 0, 0.012); sh.grp.add(back.g);
    // 黒く塗る球（プレイヤーの周り）。塗った三角形だけを描く
    const sg = new THREE.SphereGeometry(2.3, 48, 24).toNonIndexed();
    const pos = sg.attributes.position, nTri = pos.count / 3;
    const dirs = [], area = []; let total = 0;
    const a = V(0, 0, 0), b = V(0, 0, 0), c = V(0, 0, 0);
    for (let i = 0; i < nTri; i++) {
      a.fromBufferAttribute(pos, i * 3); b.fromBufferAttribute(pos, i * 3 + 1); c.fromBufferAttribute(pos, i * 3 + 2);
      dirs.push(a.clone().add(b).add(c).normalize());
      const ar = b.clone().sub(a).cross(c.clone().sub(a)).length() / 2; area.push(ar); total += ar;
    }
    const painted = new Uint8Array(nTri); let pArea = 0;
    const blackMesh = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide, depthTest: false, depthWrite: false })); blackMesh.renderOrder = 5;
    sh.grp.add(blackMesh);
    let dirty = true;
    const rebuild = () => { const idx = []; for (let i = 0; i < nTri; i++) if (painted[i]) idx.push(i * 3, i * 3 + 1, i * 3 + 2); sg.setIndex(idx); dirty = false; };
    const paintTri = i => { if (!painted[i]) { painted[i] = 1; pArea += area[i]; dirty = true; } };
    if (F.ev.s7_black_done) for (let i = 0; i < nTri; i++) paintTri(i);
    // 白い扉（真っ黒になって15秒後、右に）
    const wd = new THREE.Group(); const wp = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 1.9), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false })); wp.position.y = 0.95; wp.renderOrder = 6; wd.add(wp);
    const wdl = segs(rect2(-0.45, 0, 0.45, 1.9, 0.002), new THREE.LineBasicMaterial({ color: 0xbbbbbb, depthTest: false })); wdl.renderOrder = 7; wd.add(wdl);
    wd.position.set(2.1, FLOOR + 0.25, 0); wd.rotation.y = -Math.PI / 2; sh.grp.add(wd); wd.visible = !!F.ev.s7_wdoor;
    let t = 0, t2 = 0, t3 = 0, wdT = 0;
    const targets = {
      back: { pos: V(-W, FLOOR + 1.0, 0), act: () => !F.ev.blackStarted, examine() { say('入ってきた通路は、ふさがっている。'); } },
      wdoor: { pos: V(2.1, FLOOR + 1.2, 0), act: () => !!F.ev.s7_wdoor, examine() { goRoom('s8'); } }
    };
    const cosR = Math.cos(0.36), q = V(0, 0, 0);
    const tick = dt => {
      const blocked = dlg || menuOpen || codeOpen || editOpen || manualOpen || logOpen || busy || insp;
      if (!blocked) {
        if (!F.ev.s7_gm) { t += dt; if (t >= 20) { F.ev.s7_gm = true; say(S7_GM, () => { F.ev.s7_gm_done = true; t2 = 0; }, true); } }
        else if (F.ev.s7_gm_done && !F.ev.blackReady) { t2 += dt; if (t2 >= 20) { F.ev.blackReady = true; t3 = 0; say('＠「あなたがこれまで得たものすべてを思い出せ」', null, true); } }
        else if (F.ev.blackReady && !F.ev.blackStarted) { t3 += dt; if (t3 >= 20) { t3 = 0; say('＠「あなたがこれまで得たものすべてを思い出せ。世界の色を書き換えろ」', null, true); } }
      }
      // 黒で塗る：中央の丸の向いた所が黒くなる
      if (blackOn()) {
        q.copy(fwd);
        for (let i = 0; i < nTri; i++) if (!painted[i] && dirs[i].dot(q) > cosR) { paintTri(i); F.ev.blackStarted = true; }
      }
      // 85%を超えたら、残りも見ている方から染まっていく
      if (!F.ev.s7_black_done && pArea / total >= 0.85) F.ev.s7_filling = true;
      if (F.ev.s7_filling && !F.ev.s7_black_done) {
        const rest = []; for (let i = 0; i < nTri; i++) if (!painted[i]) rest.push(i);
        rest.sort((x, y) => dirs[y].dot(fwd) - dirs[x].dot(fwd));
        rest.slice(0, 30).forEach(paintTri);
        if (rest.length <= 30) { F.ev.s7_black_done = true; wdT = 0; }
      }
      if (F.ev.s7_black_done && !F.ev.s7_wdoor) { wdT += dt; if (wdT >= 15) { F.ev.s7_wdoor = true; wd.visible = true; say('扉が現れた。'); } }
      if (dirty) rebuild();
    };
    const onEnter = () => { if (!F.ev.s7_closed) { F.ev.s7_closed = true; rumble(1.0); } };
    return { grp: sh.grp, targets, tick, onEnter, blackable: true };
  },

  // ---- ステージ3-2：最初の部屋。出入口がふさがる。白い光で窓が消え、橋 → 「はし」に透明な空欄 → 「はしご」 → 登る ----
  s8: () => {
    const W = 2.5, D = 2.5, F = G.flags;
    const sh = roomShell(W, D, { wall: 0xffffff, floor: 0xffffff, edge: 0x000000, gridColor: 0xd4d4d4 });
    const win = { x: 0, y: 1.55, w: 1.5, h: 0.95 };
    const fWin = sh.place('front', [win]); const fPlain = sh.place('front'); sh.place('back'); sh.place('left'); sh.place('right');
    const wy = FLOOR + win.y, hw = win.w / 2, hh = win.h / 2, z = -D + 0.004;
    const frameMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true });
    const frame = segs([...loop([[-hw - 0.06, wy - hh - 0.06, z], [hw + 0.06, wy - hh - 0.06, z], [hw + 0.06, wy + hh + 0.06, z], [-hw - 0.06, wy + hh + 0.06, z]]),
      [0, wy - hh, z], [0, wy + hh, z], [-hw, wy, z], [hw, wy, z], [-hw - 0.1, wy - hh - 0.1, z + 0.08], [hw + 0.1, wy - hh - 0.1, z + 0.08]], frameMat);
    sh.grp.add(frame);
    const townG = new THREE.Group(); townBehind(townG, 0, 0.2, -D - 3.2, 9, 4.5); sh.grp.add(townG);
    // 出入口：入ったとき、入口も出口も消えて、ただの壁になる（roomShellの壁には扉を置かない）
    // 橋（部屋の真ん中、プレイヤーの前）と、はしご
    const BP = V(0, FLOOR, -1.2);
    const bridge = new THREE.Group(); const arc = [];
    for (let i = 0; i < 16; i++) { const x0 = -0.7 + i * 0.0875, x1 = x0 + 0.0875, y0 = Math.sin((x0 + 0.7) / 1.4 * Math.PI) * 0.35, y1 = Math.sin((x1 + 0.7) / 1.4 * Math.PI) * 0.35;
      for (const zz of [-0.3, 0.3]) arc.push([x0, y0, zz], [x1, y1, zz], [x0, y0 + 0.35, zz], [x1, y1 + 0.35, zz]);
      arc.push([x0, y0, -0.3], [x0, y0, 0.3]); if (i % 3 === 0) for (const zz of [-0.3, 0.3]) arc.push([x0, y0, zz], [x0, y0 + 0.35, zz]); }
    bridge.add(segs(arc)); bridge.position.copy(BP); sh.grp.add(bridge);
    const ladder = new THREE.Group(); const ll = [[-0.25, 0, 0], [-0.25, HGT, 0], [0.25, 0, 0], [0.25, HGT, 0]];
    for (let y = 0.3; y < HGT; y += 0.3) ll.push([-0.25, y, 0], [0.25, y, 0]);
    ladder.add(segs(ll)); ladder.position.copy(BP); sh.grp.add(ladder);
    const hole = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({ color: 0x000000 })); hole.rotation.x = Math.PI / 2; hole.position.set(0, CEIL - 0.003, -1.2); sh.grp.add(hole);
    const brLab = redMark('「はし」', 0.5); brLab.position.copy(BP).add(V(0, 0.5, 0.36)); sh.grp.add(brLab);
    let t = 0, prevLit = false;
    const targets = {
      window: { pos: V(0, wy, -D), act: () => !F.ev.s8_win_gone, examine() { say('窓の外に、私のいた町が見える。'); } },
      bridge: { pos: BP.clone().add(V(0, 0.5, 0.36)), act: () => !!F.ev.s8_bridge && !F.ev.s8_ladder, hidden: 's8_bridge', label: brLab,
        edit: { text: 'はし', blank: true, goal: 'はしご', flag: 's8_ladder', done() { F.ev.s8_ladder = true; say('上に行けってことなのか？', null, true); } },
        examine() { say(F.seen.s8_bridge ? '「はし」' : '部屋の真ん中に橋がある。'); } },
      ladder: { pos: BP.clone().add(V(0, 1.2, 0)), act: () => !!F.ev.s8_ladder, grab: Object.assign(climbGrab(), { obj: ladder }),
        examine() { if (climbing) return; say('はしごだ。上に登ってみよう。', () => climb(), true); } }
    };
